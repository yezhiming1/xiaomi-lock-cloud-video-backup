name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check cryptography==48.0.1 requests==2.34.2
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Audit public tree
        run: python scripts/audit_public_tree.py
